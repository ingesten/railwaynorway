<!DOCTYPE html>
<html lang="en">
<head>

    <!-- 
          Version: 19
        This page will rotate between a Bane NOR fullscreen train status of your selected railway station 
        and a Yr.no meteogram SVG for weather forecast in dark mode. Additionally, it shows NRK news in a vertical section 
        on the right side of the screen asynchronously. It dynamically adjusts news display time based on description length.
        NRK news includes proper attribution and direct links to NRK as per their guidelines.
        Author: isten
        Date: 2024-11-05
    -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Pages with Meteogram and NRK News</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: black; /* Set background color for the entire page */
        }

        #main-container {
            display: flex;
            width: 100%;
            padding-left: 5%; /* Create a 5% padding on the left */
            background-color: black;
        }

        #main-content {
            width: 65%; 
            position: relative;
            overflow: hidden;
            background-color: black; 
        }

        #sidebar {
            width: 30%; 
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #today-fact {
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 14px;
            background-color: rgba(255, 255, 255, 0.05);
            font-size: 16px;
            line-height: 1.4;
            color: #f2f2f2;
        }

        #today-fact strong {
            color: #90caf9;
        }

        #news-section {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #webframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #meteogram-container {
            display: none;
            width: 100%;
            height: 100%;
            text-align: center;
            overflow: hidden;
        }

        #meteogram {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .news-item {
            margin-bottom: 20px;
        }

        .news-title {
            font-size: 18px;
            font-weight: bold;
        }

        .news-description {
            font-size: 14px;
            margin-top: 10px;
        }

        .news-source {
            margin-top: 10px;
            font-size: 12px;
            font-style: italic;
            color: lightgray;
        }

        a {
            color: lightblue;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

    </style>

    <script>
        const ROTATION_INTERVAL = 20000; 
        const urls = [
            { url: "https://rtd.banenor.no/web_client/std?station=JEH&layout=landscape&content=departure&notice=yes", duration: 20000 },
            { url: "dualyrwidget.html", duration: 20000 },
            { url: "https://rtd.banenor.no/web_client/std?station=JEH&content=track&header=no&notice=yes&track=1", duration: 15000 }
        ];

        let currentIndex = 0;
        let rotationCount = 0;
        let newsIndex = 0;

        const TODAY_FACTS = {
            "01-01": "På denne dagen i 1993 ble Tsjekkoslovakia delt i Tsjekkia og Slovakia.",
            "02-14": "På denne dagen i 1876 søkte Alexander Graham Bell patent på telefonen.",
            "03-14": "På denne dagen i 1879 ble Albert Einstein født.",
            "04-09": "På denne dagen invaderte Tyskland Norge i 1940.",
            "05-17": "På denne dagen i 1814 ble Norges grunnlov vedtatt på Eidsvoll.",
            "06-07": "På denne dagen i 1905 vedtok Stortinget at unionen med Sverige var oppløst.",
            "07-20": "På denne dagen i 1969 tok mennesket sine første steg på månen.",
            "08-17": "På denne dagen i 1945 ble Indonesia erklært uavhengig.",
            "09-08": "På denne dagen i 1971 ble John Lennon-låten «Imagine» utgitt.",
            "10-01": "På denne dagen i 1908 ble Ford Model T lansert.",
            "11-09": "På denne dagen i 1989 falt Berlinmuren.",
            "12-05": "På denne dagen ville Walt Disney vært {{age}} år gammel."
        };

        const FALLBACK_FACTS = [
            "På denne dagen i 2012 landet romsonden Curiosity trygt på Mars.",
            "På denne dagen i 1958 ble NASA offisielt opprettet.",
            "På denne dagen i 2008 åpnet Svalbard globale frøhvelv."
        ];

        function getTodayFact(date = new Date()) {
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const key = `${month}-${day}`;
            const fact = TODAY_FACTS[key];

            if (fact) {
                const age = date.getFullYear() - 1901;
                return fact.replace('{{age}}', age);
            }

            const fallbackIndex = date.getDate() % FALLBACK_FACTS.length;
            return FALLBACK_FACTS[fallbackIndex];
        }

        function renderTodayFact() {
            const todayFactEl = document.getElementById('today-fact');
            todayFactEl.innerHTML = `<strong>På denne dagen:</strong> ${getTodayFact()}`;
        }

        // Function to calculate dynamic display time based on description length
        function calculateDisplayTime(description) {
            const baseTime = 5000; 
            const charsPerSecond = 35; 
            const additionalTime = (description ? description.length : 0) / charsPerSecond * 1000;
            return baseTime + additionalTime; 
        }

        function rotatePages() {
            const currentPage = urls[currentIndex];

            if (currentPage.url === "meteogram") {
                document.getElementById('webframe').style.display = 'none';
                document.getElementById('meteogram-container').style.display = 'block';
            } else {
                document.getElementById('meteogram-container').style.display = 'none';
                document.getElementById('webframe').style.display = 'block';
                document.getElementById('webframe').src = currentPage.url;
            }

            console.log(`Rotating to: ${currentPage.url} (Duration: ${currentPage.duration / 1000} seconds)`);

            rotationCount++;
            currentIndex = (currentIndex + 1) % urls.length;
            setTimeout(rotatePages, currentPage.duration);
        }

        function updateNews(items) {
            const newsSection = document.getElementById('news-section');
            if (!items || items.length === 0) {
                newsSection.textContent = "No news available.";
                return;
            }
            const item = items[newsIndex];

            newsSection.innerHTML = `
                <div class="news-item">
                    <a href="${item.link}" target="_blank" class="news-title">${item.title}</a>
                    <div class="news-description">${item.description || "No description available."}</div>
                    <div class="news-source">Kilde: <a href="https://www.nrk.no" target="_blank">NRK Nyheter</a></div>
                </div>
            `;

            const displayTime = calculateDisplayTime(item.description || "");
            console.log(`Displaying news: "${item.title}" for ${displayTime / 1000} seconds`);
            
            newsIndex = (newsIndex + 1) % items.length;
            setTimeout(() => updateNews(items), displayTime);
        }

        async function fetchRSSFeed() {
            try {
                const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.nrk.no/nyheter/siste.rss');
                const data = await response.json();
                const items = data.items;
                if (!items || items.length === 0) {
                    console.warn('No news items returned from NRK feed.');
                }
                console.log(`Fetched ${items ? items.length : 0} news items from NRK.`);
                updateNews(items); 
            } catch (error) {
                console.error('Error fetching RSS feed:', error);
            }
        }

        window.onload = function() {
            renderTodayFact();
            rotatePages(); 
            fetchRSSFeed(); 
        };
    </script>
</head>
<body>
    <div id="main-container">
        <div id="main-content">
            <iframe id="webframe"></iframe>

            <div id="meteogram-container">
                <img id="meteogram" src="https://www.yr.no/nb/innhold/1-87761/meteogram.svg?mode=dark" alt="Yr.no Meteogram" />
            </div>
        </div>

        <div id="sidebar">
            <div id="today-fact">Laster dagens fun fact...</div>
            <div id="news-section">
                Loading news...
            </div>
        </div>
    </div>
</body>
</html>
